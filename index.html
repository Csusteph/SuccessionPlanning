<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Succession Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;0,9..144,700;1,9..144,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b0f14;--surface:#13181f;--surface2:#1c2330;--surface3:#252d3a;--border:#2a3341;
  --text:#e8edf4;--text-muted:#6b7a90;--text-dim:#4a5568;
  --accent:#d4a853;--accent-dim:rgba(212,168,83,.15);
  --blue:#4d9ef5;--blue-dim:rgba(77,158,245,.12);
  --green:#3ecf72;--green-dim:rgba(62,207,114,.12);
  --red:#f05252;--red-dim:rgba(240,82,82,.12);
  --warn:#e8a03a;--warn-dim:rgba(232,160,58,.12);
  --radius:10px;--radius-lg:14px;
  --shadow:0 8px 40px rgba(0,0,0,.5);
  --shadow-sm:0 2px 12px rgba(0,0,0,.3);
}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',-apple-system,sans-serif;min-height:100vh;line-height:1.5}

/* ── Layout ── */
.app{display:flex;flex-direction:column;min-height:100vh}
.main-content{flex:1;padding-bottom:60px}

/* ── Banner ── */
.banner{padding:9px 28px;font-size:12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);letter-spacing:.01em}
.banner.connected{background:var(--green-dim);color:var(--green);border-color:rgba(62,207,114,.25)}
.banner.sample{background:var(--warn-dim);color:var(--warn);border-color:rgba(232,160,58,.25)}
.banner.error-state{background:var(--red-dim);color:var(--red);border-color:rgba(240,82,82,.25)}
.banner .dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex-shrink:0}
.banner .spacer{margin-left:auto}

/* ── Header ── */
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 28px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:100;backdrop-filter:blur(12px)}
.logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--accent) 0%,#a8792a 100%);display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-size:15px;font-weight:700;color:#000;flex-shrink:0;letter-spacing:-.5px}
.header-text h1{font-family:'Fraunces',serif;font-size:18px;font-weight:600;letter-spacing:-.3px;line-height:1.2}
.header-text p{font-size:11px;color:var(--text-muted);margin-top:1px}
.header-actions{margin-left:auto;display:flex;gap:8px;align-items:center}

/* ── Toolbar ── */
.toolbar{padding:12px 28px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;gap:10px;flex-wrap:wrap;align-items:center;position:sticky;top:66px;z-index:90}
.search-wrap{position:relative;flex:1;min-width:200px;max-width:380px}
.search-wrap input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:8px 12px 8px 32px;color:var(--text);font-size:13px;font-family:inherit;outline:none;transition:border-color .15s}
.search-wrap input:focus{border-color:var(--blue)}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-dim);font-size:13px;pointer-events:none}
.filter-select{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:8px 10px;color:var(--text);font-size:12px;font-family:inherit;outline:none;cursor:pointer;transition:border-color .15s}
.filter-select:focus{border-color:var(--blue)}
.record-count{margin-left:auto;font-size:11px;color:var(--text-muted);background:var(--surface2);border:1px solid var(--border);padding:4px 10px;border-radius:20px}

/* ── Stats Strip ── */
.stats{padding:16px 28px 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:12px 14px;display:flex;align-items:center;gap:12px}
.stat-icon{width:38px;height:38px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.stat-label{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.7px;margin-bottom:2px}
.stat-value{font-family:'Fraunces',serif;font-size:22px;font-weight:600;line-height:1}

/* ── Grid ── */
.grid{padding:16px 28px;display:grid;grid-template-columns:repeat(auto-fill,minmax(370px,1fr));gap:16px}

/* ── Card ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;transition:transform .18s,box-shadow .18s,border-color .18s}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.card.is-editing{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-dim)}
.card-head{padding:14px;display:flex;gap:11px;align-items:flex-start;background:linear-gradient(180deg,var(--surface2) 0%,var(--surface) 100%);border-bottom:1px solid var(--border)}
.avatar{width:44px;height:44px;border-radius:9px;background:var(--surface3);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;color:var(--accent);font-family:'Fraunces',serif;flex-shrink:0;letter-spacing:-.5px}
.card-name{font-size:14px;font-weight:600;line-height:1.3}
.card-title{font-size:11px;color:var(--accent);font-weight:500;margin-top:2px}
.card-meta{font-size:11px;color:var(--text-muted);margin-top:3px}
.card-acts{margin-left:auto;display:flex;gap:5px;flex-shrink:0}
.card-body{padding:14px;display:flex;flex-direction:column;gap:13px}

/* ── Ratings ── */
.ratings-row{display:flex;gap:7px}
.rating-chip{flex:1;display:flex;flex-direction:column;align-items:center;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:7px 4px;gap:5px}
.chip-year{font-size:10px;color:var(--text-muted)}
.box-badge{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff}
.rating-sel{width:100%;border:none;background:transparent;font-size:14px;font-weight:700;text-align:center;cursor:pointer;outline:none;font-family:inherit;padding:0}

/* ── Succession ── */
.suc-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.suc-col{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px}
.suc-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;margin-bottom:5px;padding-bottom:5px;border-bottom:1px solid var(--border)}
.suc-label.now{color:var(--green)}.suc-label.y12{color:var(--warn)}.suc-label.y35{color:var(--blue)}
.suc-names{font-size:11px;line-height:1.65;color:var(--text);min-height:30px}
.suc-names.empty{color:var(--text-dim)}
.suc-textarea{width:100%;background:transparent;border:none;color:var(--text);font-size:11px;font-family:inherit;resize:none;outline:none;line-height:1.65;min-height:44px}

/* ── Meta row ── */
.meta-row{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.meta-pill{background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:3px 9px;font-size:11px;color:var(--text-muted);display:flex;align-items:center;gap:3px}
.meta-pill strong{color:var(--text)}
.mob-select{background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:3px 9px;font-size:11px;color:var(--text);font-family:inherit;cursor:pointer;outline:none}

/* ── Notes ── */
.notes-view{font-size:12px;line-height:1.55;color:var(--text-muted)}
.notes-view.has-notes{color:var(--text)}
.notes-edit{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;color:var(--text);font-size:12px;font-family:inherit;resize:none;outline:none;min-height:50px;transition:border-color .15s}
.notes-edit:focus{border-color:var(--blue)}

/* ── Section label ── */
.sec-label{font-size:9px;font-weight:700;letter-spacing:.9px;color:var(--text-dim);text-transform:uppercase;margin-bottom:7px}

/* ── Buttons ── */
.btn{border:none;border-radius:8px;padding:7px 13px;font-size:12px;font-family:inherit;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:5px;transition:background .15s,color .15s,opacity .15s;white-space:nowrap}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-ghost{background:transparent;color:var(--text-muted);border:1px solid var(--border)}
.btn-ghost:hover:not(:disabled){background:var(--surface2);color:var(--text)}
.btn-primary{background:var(--accent);color:#000;font-weight:600}
.btn-primary:hover:not(:disabled){background:#c49443}
.btn-success{background:var(--green);color:#000;font-weight:600}
.btn-success:hover:not(:disabled){background:#2eb85c}
.btn-danger{background:var(--red-dim);color:var(--red);border:1px solid rgba(240,82,82,.3)}
.btn-danger:hover:not(:disabled){background:rgba(240,82,82,.25)}
.btn-sm{padding:5px 10px;font-size:11px;border-radius:7px}

/* ── States ── */
.loading-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:100px 32px;gap:14px;color:var(--text-muted)}
.spinner{width:32px;height:32px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .75s linear infinite}
.loading-label{font-size:13px}
@keyframes spin{to{transform:rotate(360deg)}}
.empty-state{text-align:center;padding:80px 32px;color:var(--text-muted)}
.empty-state h3{font-family:'Fraunces',serif;font-size:20px;margin-bottom:8px;color:var(--text)}
.empty-state p{font-size:13px;max-width:400px;margin:0 auto 16px}

/* ── Error panel ── */
.error-panel{margin:20px 28px;background:var(--red-dim);border:1px solid rgba(240,82,82,.3);border-radius:var(--radius-lg);padding:20px 24px}
.error-panel h3{font-family:'Fraunces',serif;font-size:16px;color:var(--red);margin-bottom:8px}
.error-panel p{font-size:13px;color:var(--text-muted);margin-bottom:12px}
.error-detail{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--text-muted);white-space:pre-wrap;word-break:break-all;margin-bottom:12px;max-height:120px;overflow-y:auto}
.error-tips{margin:0;padding-left:16px;font-size:12px;color:var(--text-muted);line-height:1.9}
.error-tips li strong{color:var(--text)}

/* ── Toast ── */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:10px 16px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow);font-size:13px;z-index:500;max-width:88vw;animation:slideUp .25s ease}
.toast.success{border-color:rgba(62,207,114,.4);color:var(--green)}
.toast.error{border-color:rgba(240,82,82,.4);color:var(--red)}
.toast.info{border-color:rgba(232,160,58,.4);color:var(--warn)}
@keyframes slideUp{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* ── Modal ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:400;padding:20px;backdrop-filter:blur(4px)}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px;width:600px;max-width:100%;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow)}
.modal h2{font-family:'Fraunces',serif;font-size:20px;font-weight:600;margin-bottom:4px}
.modal-sub{font-size:13px;color:var(--text-muted);margin-bottom:20px}
.tab-bar{display:flex;gap:2px;margin-bottom:20px;background:var(--surface2);border-radius:var(--radius);padding:3px}
.tab{flex:1;padding:7px 10px;font-size:12px;font-weight:500;font-family:inherit;border:none;background:transparent;color:var(--text-muted);border-radius:8px;cursor:pointer;transition:background .15s,color .15s}
.tab.active{background:var(--surface3);color:var(--text)}
.form-group{margin-bottom:14px}
.form-label{font-size:11px;color:var(--text-muted);display:block;margin-bottom:5px;font-weight:600;letter-spacing:.3px;text-transform:uppercase}
.form-input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:9px 12px;color:var(--text);font-size:13px;font-family:inherit;outline:none;transition:border-color .15s}
.form-input:focus{border-color:var(--blue)}
.form-hint{font-size:11px;color:var(--text-dim);margin-top:4px}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}

/* ── Field map table ── */
.field-table{width:100%;border-collapse:collapse;font-size:11px;margin-top:8px}
.field-table th{text-align:left;padding:6px 10px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--text-dim);border-bottom:1px solid var(--border)}
.field-table td{padding:5px 10px;border-bottom:1px solid rgba(42,51,65,.5);vertical-align:middle}
.field-table td:first-child{color:var(--text-muted);font-family:ui-monospace,Menlo,monospace}
.field-table .field-input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:4px 8px;color:var(--text);font-size:11px;font-family:ui-monospace,Menlo,monospace;outline:none}
.field-table .field-input:focus{border-color:var(--blue)}

/* ── Discovery ── */
.disco-area{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-family:ui-monospace,Menlo,monospace;font-size:10px;color:var(--text-muted);min-height:120px;max-height:240px;overflow-y:auto;white-space:pre-wrap;word-break:break-all}
.disco-hint{font-size:12px;color:var(--text-muted);margin-bottom:10px;line-height:1.6}
.field-detected{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.field-tag{background:var(--surface3);border:1px solid var(--border);border-radius:6px;padding:3px 8px;font-family:ui-monospace,Menlo,monospace;font-size:10px;color:var(--text-muted);cursor:pointer;transition:background .15s,color .15s}
.field-tag:hover{background:var(--accent-dim);color:var(--accent);border-color:rgba(212,168,83,.3)}

@media(max-width:640px){
  .header,.toolbar,.stats,.grid,.banner,.error-panel{padding-left:14px;padding-right:14px}
  .grid{grid-template-columns:1fr}
  .toolbar{top:60px}
}
</style>
</head>
<body>
<div id="root"></div>
<script id="app-config" type="application/json">{
  "siteUrl": "https://reyesholdings.sharepoint.com/teams/ta-rccb",
  "listName": "SAMPLE TR",
  "fieldMap": {
    "id":              "Title",
    "eeId":            "EE_x0020_ID",
    "name":            "EE_x0020_Name",
    "title":           "Job_x0020_Title",
    "level":           "Level",
    "location":        "EE_x0020_Location",
    "leader":          "Leader",
    "timeInJob":       "Time_x0020_in_x0020_Job_x003f_",
    "box2024":         "x2024_x0020_Box_x0020_Rating",
    "box2025":         "x2025_x0020_Box_x0020_Rating",
    "box2026":         "x2026_x0020_Box_x0020_Rating",
    "nextRole":        "Next_x0020_Role",
    "mobilityTier":    "Mobility_x0020_Tier_x0020_1_x002",
    "suitablyPlaced":  "Suitably_x0020_Placed",
    "readyNow":        "Ready_x0020_Now",
    "ready12":         "Ready_x0020_in_x0020_1_x002d_2_x",
    "ready35":         "Ready_x0020_in_x0020_3_x002d_5_x",
    "hireDate":        "Hire_x0020_Date",
    "department":      "Department",
    "relocationAvail": "Relocation_x0020_Avail",
    "relocationNotes": "Relocation_x0020_Notes",
    "function":        "Function"
  }
}</script>
<script>
(function(){
'use strict';

/* ─────────────────────────────────────────
   Config & field map
───────────────────────────────────────── */
var DEFAULTS = JSON.parse(document.getElementById('app-config').textContent);

var BOX = {
  1:{label:'1',desc:'Low Performer / Low Potential', color:'#ef4444'},
  2:{label:'2',desc:'Needs Development',             color:'#f97316'},
  3:{label:'3',desc:'Solid Performer',               color:'#eab308'},
  4:{label:'4',desc:'High Potential',                color:'#22c55e'},
  5:{label:'5',desc:'Top Talent',                    color:'#0ea5e9'}
};

var MOBILITY = [
  {v:'1', label:'Tier 1 – Local Only'},
  {v:'2', label:'Tier 2 – Open to Region'},
  {v:'3', label:'Tier 3 – Fully Mobile'}
];

/* ─────────────────────────────────────────
   Persistent config
───────────────────────────────────────── */
function loadStoredConfig(){
  try{
    var raw = localStorage.getItem('sp.succession.cfg');
    if(raw){ var p=JSON.parse(raw); if(p&&p.siteUrl&&p.listName) return p; }
  }catch(e){}
  return null;
}
function saveStoredConfig(c){ try{ localStorage.setItem('sp.succession.cfg', JSON.stringify(c)); }catch(e){} }

function detectSiteUrl(){
  try{ var ctx=window._spPageContextInfo; if(ctx) return ctx.webAbsoluteUrl||ctx.siteAbsoluteUrl||null; }catch(e){}
  return null;
}
function isSharePointHost(){
  try{ if(window._spPageContextInfo) return true; }catch(e){}
  return /\.sharepoint\.com$/i.test(location.hostname);
}

/* ─────────────────────────────────────────
   State
───────────────────────────────────────── */
var stored = loadStoredConfig();
var S = {
  config: stored || DEFAULTS,
  fieldMap: (stored && stored.fieldMap) || DEFAULTS.fieldMap,
  employees: [],
  loading: false,
  loadError: null,
  source: null,           // 'sharepoint' | null
  search: '',
  filterDept: '',
  filterFunc: '',
  editingId: null,
  drafts: {},
  saving: {},
  toast: null,
  toastTimer: null,
  modal: null,            // 'settings' | 'discovery'
  modalTab: 'connection', // 'connection' | 'fields'
  discovery: {raw:'', fields:[]}
};

/* ─────────────────────────────────────────
   SP API
───────────────────────────────────────── */
function spHeaders(extra){
  var h={'Accept':'application/json;odata=nometadata','Content-Type':'application/json;odata=nometadata'};
  if(extra) for(var k in extra) h[k]=extra[k];
  return h;
}

function getDigest(site){
  try{ var c=window._spPageContextInfo&&window._spPageContextInfo.formDigestValue; if(c) return Promise.resolve(c); }catch(e){}
  return fetch(site+'/_api/contextinfo',{method:'POST',credentials:'include',headers:spHeaders()})
    .then(function(r){ if(!r.ok) throw new Error('Digest '+r.status); return r.json(); })
    .then(function(d){ return d.FormDigestValue; });
}

function buildListUrl(cfg){
  return cfg.siteUrl.replace(/\/$/,'')+"/_api/web/lists/getbytitle('"+encodeURIComponent(cfg.listName)+"')/items?$top=500&$orderby="+encodeURIComponent(S.fieldMap.name||'Title')+" asc";
}

function fetchSP(cfg){
  return fetch(buildListUrl(cfg),{credentials:'include',headers:spHeaders()})
    .then(function(r){
      if(!r.ok) return r.text().then(function(t){
        throw new Error('HTTP '+r.status+' — '+t.slice(0,300));
      });
      return r.json();
    })
    .then(function(d){ return (d.value||[]).map(rowToEmp); });
}

function saveSP(cfg, id, data){
  var site=cfg.siteUrl.replace(/\/$/,'');
  return getDigest(site).then(function(digest){
    var url=site+"/_api/web/lists/getbytitle('"+encodeURIComponent(cfg.listName)+"')/items("+id+')';
    return fetch(url,{
      method:'POST', credentials:'include',
      headers:spHeaders({'X-RequestDigest':digest,'IF-MATCH':'*','X-HTTP-Method':'MERGE'}),
      body:JSON.stringify(empToRow(data))
    }).then(function(r){
      if(!r.ok) return r.text().then(function(t){ throw new Error('Save HTTP '+r.status+' — '+t.slice(0,300)); });
    });
  });
}

/* ─────────────────────────────────────────
   Data mapping
───────────────────────────────────────── */
var FM; // shorthand
function refreshFM(){ FM = S.fieldMap; }

function rowToEmp(row){
  refreshFM();
  function s(v){ return v==null?'':String(v); }
  function b(v){ if(v==null||v==='') return null; var n=typeof v==='number'?v:parseInt(v,10); return(n>=1&&n<=5)?n:null; }
  function bo(v){ if(typeof v==='boolean') return v; if(typeof v==='string') return /^(true|yes|1)$/i.test(v); if(typeof v==='number') return v!==0; return false; }
  return {
    id: row[FM.id]||row.Id||row.ID||0,
    eeId:            s(row[FM.eeId]),
    name:            s(row[FM.name])||s(row.Title),
    title:           s(row[FM.title]),
    level:           s(row[FM.level]),
    location:        s(row[FM.location]),
    leader:          s(row[FM.leader]),
    department:      s(row[FM.department]),
    function:        s(row[FM.function]),
    timeInJob:       s(row[FM.timeInJob]),
    hireDate:        s(row[FM.hireDate]),
    box2024:         b(row[FM.box2024]),
    box2025:         b(row[FM.box2025]),
    box2026:         b(row[FM.box2026]),
    nextRole:        s(row[FM.nextRole]),
    mobilityTier:    s(row[FM.mobilityTier]),
    suitablyPlaced:  bo(row[FM.suitablyPlaced]),
    readyNow:        s(row[FM.readyNow]),
    ready12:         s(row[FM.ready12]),
    ready35:         s(row[FM.ready35]),
    relocationAvail: bo(row[FM.relocationAvail]),
    relocationNotes: s(row[FM.relocationNotes])
  };
}

function empToRow(emp){
  refreshFM();
  var o={};
  var keys=['eeId','name','title','level','location','leader','department','function',
            'timeInJob','hireDate','box2024','box2025','box2026','nextRole',
            'mobilityTier','suitablyPlaced','readyNow','ready12','ready35',
            'relocationAvail','relocationNotes'];
  keys.forEach(function(k){
    if(emp[k]!==undefined && FM[k]) o[FM[k]] = emp[k]==null?null:emp[k];
  });
  return o;
}

/* ─────────────────────────────────────────
   Helpers
───────────────────────────────────────── */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];}); }
function initials(n){ return (n||'').split(',').reverse().join(' ').trim().split(' ').filter(Boolean).slice(0,2).map(function(p){return p[0];}).join('').toUpperCase(); }
function displayName(n){ return (n||'').split(',').reverse().join(' ').trim() || n; }
function depts(){ var s={}; S.employees.forEach(function(e){ if(e.department) s[e.department]=1; }); return Object.keys(s).sort(); }
function funcs(){ var s={}; S.employees.forEach(function(e){ if(e.function) s[e.function]=1; }); return Object.keys(s).sort(); }
function filtered(){
  var q=S.search.toLowerCase();
  return S.employees.filter(function(e){
    var mq=!q||(e.name||'').toLowerCase().indexOf(q)>=0||(e.title||'').toLowerCase().indexOf(q)>=0||(e.location||'').toLowerCase().indexOf(q)>=0||(e.leader||'').toLowerCase().indexOf(q)>=0;
    var md=!S.filterDept||e.department===S.filterDept;
    var mf=!S.filterFunc||e.function===S.filterFunc;
    return mq&&md&&mf;
  });
}
function stats(){
  var hi=0,mob=0;
  S.employees.forEach(function(e){ if((e.box2026||0)>=4) hi++; if(e.mobilityTier==='3') mob++; });
  return {total:S.employees.length,hi:hi,mob:mob};
}

/* ─────────────────────────────────────────
   Toast
───────────────────────────────────────── */
function toast(type, msg){
  S.toast={type:type,msg:msg};
  if(S.toastTimer) clearTimeout(S.toastTimer);
  S.toastTimer=setTimeout(function(){ S.toast=null; render(); },4000);
  render();
}

/* ─────────────────────────────────────────
   Load
───────────────────────────────────────── */
function load(){
  S.loading=true; S.loadError=null; render();
  fetchSP(S.config)
    .then(function(items){
      S.employees=items; S.source='sharepoint'; S.loading=false;
      toast('success','Loaded '+items.length+' records from SharePoint');
    })
    .catch(function(err){
      S.loadError=err.message; S.source=null; S.loading=false; S.employees=[];
      render();
    });
}

/* ─────────────────────────────────────────
   Save edit
───────────────────────────────────────── */
function saveEdit(id){
  var draft=S.drafts[id];
  if(!draft){ S.editingId=null; return render(); }
  S.saving[id]=true; render();
  var emp=S.employees.find(function(e){ return e.id===id; });
  var prev=Object.assign({},emp);
  Object.assign(emp,draft);
  saveSP(S.config, id, draft)
    .then(function(){
      S.saving[id]=false; S.editingId=null; delete S.drafts[id];
      toast('success','Saved to SharePoint ✓');
    })
    .catch(function(err){
      Object.assign(emp,prev);
      S.saving[id]=false;
      toast('error','Save failed: '+err.message);
      render();
    });
}

/* ─────────────────────────────────────────
   Discovery
───────────────────────────────────────── */
function runDiscovery(){
  var site=S.config.siteUrl.replace(/\/$/,'');
  var url=site+"/_api/web/lists/getbytitle('"+encodeURIComponent(S.config.listName)+"')/items?$top=1";
  S.discovery={raw:'Fetching one row from list…',fields:[]};
  render();
  fetch(url,{credentials:'include',headers:spHeaders()})
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(function(d){
      var item=(d.value||[])[0]||{};
      var keys=Object.keys(item).filter(function(k){ return k!=='@odata.etag'&&k!=='odata.etag'; }).sort();
      S.discovery={raw:JSON.stringify(item,null,2), fields:keys};
      render();
    })
    .catch(function(err){
      S.discovery={raw:'Error: '+err.message+'\n\nMake sure you are logged in and the list name is correct.',fields:[]};
      render();
    });
}

/* ─────────────────────────────────────────
   Events
───────────────────────────────────────── */
function attachEvents(){
  // Actions
  document.querySelectorAll('[data-action]').forEach(function(el){
    el.addEventListener('click',function(e){
      e.stopPropagation();
      var a=el.getAttribute('data-action');
      var idAttr=el.getAttribute('data-id'); var id=idAttr?parseInt(idAttr,10):null;

      if(a==='reload'){ return load(); }
      if(a==='open-settings'){ S.modal='settings'; S.modalTab='connection'; return render(); }
      if(a==='close-modal'){ S.modal=null; return render(); }
      if(a==='open-discovery'){ S.modal='discovery'; return render(); }
      if(a==='back-to-settings'){ S.modal='settings'; return render(); }
      if(a==='run-discovery'){ return runDiscovery(); }

      if(a==='use-detected'){
        var det=detectSiteUrl();
        if(det){ var si=document.getElementById('cfg-site'); if(si) si.value=det; }
        return;
      }

      if(a==='save-settings'){
        // Gather connection
        var site=(document.getElementById('cfg-site')||{}).value||S.config.siteUrl;
        var list=(document.getElementById('cfg-list')||{}).value||S.config.listName;
        // Gather field map
        var newFm=Object.assign({},S.fieldMap);
        newFm.id='ID'; // always fixed
        document.querySelectorAll('[data-fm]').forEach(function(inp){
          var k=inp.getAttribute('data-fm'); var v=inp.value.trim();
          if(v) newFm[k]=v;
        });
        S.config={siteUrl:site.trim(),listName:list.trim()};
        S.fieldMap=newFm;
        saveStoredConfig(Object.assign({},S.config,{fieldMap:newFm}));
        S.modal=null;
        return load();
      }

      if(a==='start-edit'){
        S.editingId=id;
        var emp=S.employees.find(function(e){return e.id===id;});
        S.drafts[id]=Object.assign({},emp);
        return render();
      }
      if(a==='cancel-edit'){ S.editingId=null; delete S.drafts[id]; return render(); }
      if(a==='save-edit'){ return saveEdit(id); }
    });
  });

  // Tabs
  document.querySelectorAll('[data-tab]').forEach(function(el){
    el.addEventListener('click',function(){
      S.modalTab=el.getAttribute('data-tab');
      render();
    });
  });

  // Search
  var si=document.getElementById('search-input');
  if(si){
    si.addEventListener('input',function(e){ S.search=e.target.value; render(); var sf=document.getElementById('search-input'); if(sf){sf.focus();sf.setSelectionRange(S.search.length,S.search.length);} });
  }

  // Filters
  document.querySelectorAll('[data-filter]').forEach(function(sel){
    sel.addEventListener('change',function(e){
      var f=sel.getAttribute('data-filter');
      if(f==='dept') S.filterDept=e.target.value;
      if(f==='func') S.filterFunc=e.target.value;
      render();
    });
  });

  // Inline field edits
  document.querySelectorAll('[data-edit]').forEach(function(el){
    var id=parseInt(el.getAttribute('data-edit'),10);
    var field=el.getAttribute('data-field');
    var handler=function(e){
      var v=e.target.value;
      if(/^box/.test(field)) v=v?parseInt(v,10):null;
      S.drafts[id]=S.drafts[id]||{};
      S.drafts[id][field]=v;
    };
    el.addEventListener('change',handler);
    el.addEventListener('input',handler);
  });

  // Field tag copy
  document.querySelectorAll('[data-copy-field]').forEach(function(el){
    el.addEventListener('click',function(){
      var val=el.getAttribute('data-copy-field');
      try{ navigator.clipboard.writeText(val).then(function(){ toast('info','Copied: '+val); }); }
      catch(e){ toast('info',val); }
    });
  });

  // Close modal on overlay click
  document.querySelectorAll('.overlay').forEach(function(ov){
    ov.addEventListener('click',function(e){
      if(e.target===ov){ S.modal=null; render(); }
    });
  });
}

if(isSharePointHost()){
  var det=detectSiteUrl();
  if(det) S.config.siteUrl=det;
  load();
} else {
  // Not in SP — show settings prompt but don't crash
  S.loadError='This page must be hosted inside SharePoint to access the list API. Host it as a SharePoint site page and reload.';
  render();
}

})();
