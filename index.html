<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Succession Planner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#0d1117;--surface:#161b22;--surface2:#21262d;--surface3:#30363d;
      --border:#30363d;--text:#e6edf3;--text-muted:#7d8590;
      --accent:#d4a853;--accent2:#58a6ff;--success:#3fb950;--danger:#f85149;--warn:#d29922;
      --radius:10px;--shadow:0 8px 32px rgba(0,0,0,.4);
    }
    body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh}
    .app{min-height:100vh;display:flex;flex-direction:column}
    .banner{padding:8px 32px;font-size:13px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border)}
    .banner.ok{background:rgba(63,185,80,.1);color:var(--success);border-color:rgba(63,185,80,.3)}
    .banner.warn{background:rgba(210,153,34,.1);color:var(--warn);border-color:rgba(210,153,34,.3)}
    .banner button{margin-left:auto}
    .header{background:linear-gradient(135deg,#0d1117 0%,#161b22 100%);border-bottom:1px solid var(--border);padding:18px 32px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:100}
    .header-logo{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#b8860b);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#000;flex-shrink:0;font-family:'Fraunces',serif}
    .header h1{font-family:'Fraunces',serif;font-size:20px;font-weight:600;letter-spacing:-.3px}
    .header p{font-size:12px;color:var(--text-muted)}
    .header-actions{margin-left:auto;display:flex;gap:10px;align-items:center}
    .toolbar{padding:16px 32px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;gap:12px;flex-wrap:wrap;align-items:center;position:sticky;top:76px;z-index:90}
    .search-wrap{position:relative;flex:1;min-width:220px;max-width:420px}
    .search-wrap input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:9px 12px 9px 34px;color:var(--text);font-size:14px;font-family:inherit;outline:none;transition:border-color .2s}
    .search-wrap input:focus{border-color:var(--accent2)}
    .search-wrap .icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:14px;pointer-events:none}
    select{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:9px 12px;color:var(--text);font-size:13px;font-family:inherit;outline:none;cursor:pointer}
    .badge-count{background:var(--surface2);border:1px solid var(--border);padding:5px 12px;border-radius:20px;font-size:12px;color:var(--text-muted)}
    .stats{padding:20px 32px 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
    .stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:14px}
    .stat-icon{width:40px;height:40px;border-radius:8px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:18px}
    .stat-label{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
    .stat-val{font-family:'Fraunces',serif;font-size:24px;font-weight:600}
    .grid{padding:20px 32px;display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:20px}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;transition:transform .2s,box-shadow .2s}
    .card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
    .card.editing{border-color:var(--accent);box-shadow:0 0 0 2px rgba(212,168,83,.2)}
    .card-header{padding:16px 16px 14px;display:flex;gap:12px;align-items:flex-start;background:linear-gradient(180deg,var(--surface2) 0%,var(--surface) 100%);border-bottom:1px solid var(--border)}
    .avatar{width:48px;height:48px;border-radius:10px;background:var(--surface3);overflow:hidden;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;color:var(--accent);font-family:'Fraunces',serif;flex-shrink:0}
    .card-name{font-size:15px;font-weight:600;line-height:1.3}
    .card-title{font-size:12px;color:var(--accent);font-weight:500;margin-top:2px}
    .card-meta{font-size:11px;color:var(--text-muted);margin-top:4px}
    .card-actions{margin-left:auto;display:flex;gap:6px;flex-shrink:0}
    .card-body{padding:14px 16px;display:flex;flex-direction:column;gap:14px}
    .ratings-row{display:flex;gap:8px}
    .rating-chip{flex:1;display:flex;flex-direction:column;align-items:center;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 4px}
    .rating-chip .year{font-size:10px;color:var(--text-muted);margin-bottom:4px}
    .box-val{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#fff}
    .rating-select{width:100%;border:none;background:transparent;color:var(--text);font-size:13px;font-weight:700;text-align:center;cursor:pointer;outline:none;font-family:inherit}
    .section-label{font-size:10px;font-weight:600;letter-spacing:1px;color:var(--text-muted);text-transform:uppercase;margin-bottom:8px}
    .succession-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
    .succession-col{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px}
    .col-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;padding-bottom:6px;border-bottom:1px solid var(--border)}
    .col-label.now{color:var(--success)}.col-label.y12{color:var(--warn)}.col-label.y35{color:var(--accent2)}
    .succession-names{font-size:11px;line-height:1.6;min-height:32px}
    .succession-textarea{width:100%;background:transparent;border:none;color:var(--text);font-size:11px;font-family:inherit;resize:none;outline:none;line-height:1.6;min-height:48px}
    .meta-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    .meta-pill{background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:4px 10px;font-size:11px;color:var(--text-muted);display:flex;align-items:center;gap:4px}
    .meta-pill strong{color:var(--text)}
    .mobility-select{background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:4px 10px;font-size:11px;color:var(--text);font-family:inherit;cursor:pointer;outline:none}
    .notes-textarea{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;color:var(--text);font-size:12px;font-family:inherit;resize:none;outline:none;min-height:52px}
    .notes-textarea:focus{border-color:var(--accent2)}
    .btn{border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-family:inherit;cursor:pointer;font-weight:500;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .btn-ghost{background:transparent;color:var(--text-muted);border:1px solid var(--border)}
    .btn-ghost:hover:not(:disabled){background:var(--surface2);color:var(--text)}
    .btn-primary{background:var(--accent);color:#000}
    .btn-primary:hover:not(:disabled){background:#c49443}
    .btn-success{background:var(--success);color:#000}
    .btn-success:hover:not(:disabled){background:#2ea043}
    .btn-sm{padding:5px 10px;font-size:12px;border-radius:6px}
    .status-bar{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px 18px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow);font-size:13px;z-index:200;animation:slideUp .3s ease;max-width:90vw}
    .status-bar.success{border-color:var(--success)}.status-bar.error{border-color:var(--danger)}.status-bar.info{border-color:var(--warn)}
    @keyframes slideUp{from{transform:translateX(-50%) translateY(20px);opacity:0}to{transform:translateX(-50%) translateY(0);opacity:1}}
    .loading{display:flex;align-items:center;justify-content:center;padding:80px;gap:12px;color:var(--text-muted)}
    .spinner{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .empty{text-align:center;padding:80px 32px;color:var(--text-muted)}
    .empty h3{font-size:18px;margin-bottom:8px;color:var(--text)}
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:300;padding:20px}
    .modal{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:24px;width:560px;max-width:100%;max-height:90vh;overflow-y:auto}
    .modal h2{font-family:'Fraunces',serif;font-size:20px;margin-bottom:6px}
    .modal p{font-size:13px;color:var(--text-muted);margin-bottom:18px}
    .form-group{margin-bottom:14px}
    .form-group label{font-size:12px;color:var(--text-muted);display:block;margin-bottom:5px;font-weight:500}
    .form-group input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:9px 12px;color:var(--text);font-size:14px;font-family:inherit;outline:none}
    .form-group input:focus{border-color:var(--accent2)}
    .modal-footer{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
    .field-map{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px;margin-top:10px}
    .field-map-title{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);margin-bottom:6px}
    .field-map-grid{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;font-size:11px;font-family:ui-monospace,monospace}
    .field-map-grid > div{display:flex;justify-content:space-between;gap:8px}
    .field-map-grid .k{color:var(--text-muted)}
    @media(max-width:640px){
      .header,.toolbar,.stats,.grid,.banner{padding-left:16px;padding-right:16px}
    }
  </style>
</head>

  <script>
  (function(){
    var DATA = JSON.parse(document.getElementById('embedded-data').textContent);
    var FIELD_MAP = DATA.fieldMap;
    var BOX_LABELS = DATA.boxLabels;
    var MOBILITY_TIERS = DATA.mobilityTiers;
    var SAMPLE = DATA.sampleEmployees;

    // ---- State ----
    var state = {
      config: loadConfig() || DATA.config,
      employees: [],
      loading: true,
      search: '',
      filterDept: '',
      filterTier: '',
      source: 'sample',
      lastError: null,
      editingId: null,
      drafts: {},
      saving: {},
      configOpen: false,
      configDraft: null,
      status: null,
      statusTimer: null,
    };

    function loadConfig(){
      try{var raw=localStorage.getItem('succession-planner.sp-config');if(raw){var p=JSON.parse(raw);if(p&&p.siteUrl&&p.listName)return p;}}catch(e){}return null;
    }
    function saveConfig(c){try{localStorage.setItem('succession-planner.sp-config',JSON.stringify(c));}catch(e){}}

    function detectedSiteUrl(){
      try{var ctx=window._spPageContextInfo;if(ctx){return ctx.webAbsoluteUrl||ctx.siteAbsoluteUrl||null;}}catch(e){}return null;
    }
    function inSharePoint(){
      try{if(window._spPageContextInfo)return true;}catch(e){}
      return /.sharepoint.com$/i.test(location.hostname);
    }

    // ---- SharePoint client ----
    function spHeaders(extra){var h={Accept:'application/json;odata=nometadata','Content-Type':'application/json;odata=nometadata'};if(extra)for(var k in extra)h[k]=extra[k];return h;}
    function getDigest(siteUrl){
      try{var c=window._spPageContextInfo&&window._spPageContextInfo.formDigestValue;if(c)return Promise.resolve(c);}catch(e){}
      return fetch(siteUrl.replace(/\/$/,'')+'/_api/contextinfo',{method:'POST',credentials:'include',headers:spHeaders()}).then(function(r){if(!r.ok)throw new Error('digest '+r.status);return r.json();}).then(function(d){return d.FormDigestValue;});
    }
    function fetchItems(cfg){
      var url=cfg.siteUrl.replace(/\/$/,'')+"/_api/web/lists/getbytitle('"+encodeURIComponent(cfg.listName)+"')/items?$top=500";
      return fetch(url,{credentials:'include',headers:spHeaders()}).then(function(r){if(!r.ok)return r.text().then(function(t){throw new Error('Load '+r.status+': '+t.slice(0,200));});return r.json();}).then(function(d){return (d.value||[]).map(rowToEmployee);});
    }
    function updateItem(cfg,id,updates){
      var site=cfg.siteUrl.replace(/\/$/,'');
      return getDigest(site).then(function(digest){
        var url=site+"/_api/web/lists/getbytitle('"+encodeURIComponent(cfg.listName)+"')/items("+id+")";
        var body=employeeToRow(updates);
        return fetch(url,{method:'POST',credentials:'include',headers:spHeaders({'X-RequestDigest':digest,'IF-MATCH':'*','X-HTTP-Method':'MERGE'}),body:JSON.stringify(body)}).then(function(r){if(!r.ok)return r.text().then(function(t){throw new Error('Save '+r.status+': '+t.slice(0,200));});});
      });
    }

    function rowToEmployee(row){
      function s(v){return v==null?'':String(v);}
      function b(v){if(v==null||v==='')return null;var n=typeof v==='number'?v:parseInt(v,10);return (n>=1&&n<=5)?n:null;}
      function bo(v){if(typeof v==='boolean')return v;if(typeof v==='string')return /^(true|yes|1)$/i.test(v);if(typeof v==='number')return v!==0;return false;}
      return {
        id: row[FIELD_MAP.id]||row.Id||row.ID||0,
        eeId:s(row[FIELD_MAP.eeId]),name:s(row[FIELD_MAP.name]),title:s(row[FIELD_MAP.title]),level:s(row[FIELD_MAP.level]),
        location:s(row[FIELD_MAP.location]),leader:s(row[FIELD_MAP.leader]),department:s(row[FIELD_MAP.department]),
        function:s(row[FIELD_MAP.function]),timeInJob:s(row[FIELD_MAP.timeInJob]),hireDate:s(row[FIELD_MAP.hireDate]),
        box2024:b(row[FIELD_MAP.box2024]),box2025:b(row[FIELD_MAP.box2025]),box2026:b(row[FIELD_MAP.box2026]),
        nextRole:s(row[FIELD_MAP.nextRole]),mobilityTier:s(row[FIELD_MAP.mobilityTier]),
        suitablyPlaced:bo(row[FIELD_MAP.suitablyPlaced]),readyNow:s(row[FIELD_MAP.readyNow]),
        ready12:s(row[FIELD_MAP.ready12]),ready35:s(row[FIELD_MAP.ready35]),
        relocationAvail:bo(row[FIELD_MAP.relocationAvail]),relocationNotes:s(row[FIELD_MAP.relocationNotes]),
      };
    }
    function employeeToRow(emp){
      var o={};var keys=['eeId','name','title','level','location','leader','department','function','timeInJob','hireDate','box2024','box2025','box2026','nextRole','mobilityTier','suitablyPlaced','readyNow','ready12','ready35','relocationAvail','relocationNotes'];
      keys.forEach(function(k){if(emp[k]!==undefined){o[FIELD_MAP[k]]=k==='mobilityTier'?(emp[k]||null):emp[k];}});
      return o;
    }

    // ---- Render ----
    function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
    function initials(name){var parts=(name||'').split(',').reverse().join(' ').trim().split(' ').filter(Boolean);return parts.slice(0,2).map(function(p){return p[0];}).join('').toUpperCase();}
    function displayName(name){return (name||'').split(',').reverse().join(' ').trim();}

    function showStatus(type,msg){state.status={type:type,msg:msg};if(state.statusTimer)clearTimeout(state.statusTimer);state.statusTimer=setTimeout(function(){state.status=null;render();},4000);render();}

    function render(){
      var root=document.getElementById('root');
      var filtered=getFiltered();
      var stats=getStats();
      var depts=getDepts();

      root.innerHTML=''+
        '<div class="app">'+
          renderBanner()+
          renderHeader()+
          renderToolbar(depts,filtered.length)+
          renderStats(stats)+
          (state.loading?'<div class="loading"><div class="spinner"></div><span>Loading…</span></div>':
            filtered.length===0?'<div class="empty"><h3>No matching employees</h3><p>Try clearing filters.</p></div>':
            '<div class="grid">'+filtered.map(renderCard).join('')+'</div>')+
          (state.status?renderStatus():'')+
          (state.configOpen?renderConfigModal():'')+
        '</div>';
      attachEvents();
    }

    function renderBanner(){
      if(state.source==='sharepoint'){
        return '<div class="banner ok">☁️ Connected to <strong style="margin:0 4px">'+escapeHtml(state.config.listName)+'</strong> on <strong style="margin-left:4px">'+escapeHtml(state.config.siteUrl.replace(/^https?:///,''))+'</strong></div>';
      }
      var why=state.lastError?(inSharePoint()?' — List fetch failed':' — Not hosted inside SharePoint'):'';
      return '<div class="banner warn">⚠️ Showing <strong style="margin:0 4px">sample data</strong>'+why+'<button class="btn btn-ghost btn-sm" data-action="open-config">Configure connection</button></div>';
    }
    function renderHeader(){
      return '<div class="header">'+
        '<div class="header-logo">SP</div>'+
        '<div><h1>Succession Planner</h1><p>'+escapeHtml(state.config.siteUrl.replace(/^https?:///,''))+' · '+escapeHtml(state.config.listName)+'</p></div>'+
        '<div class="header-actions">'+
          '<button class="btn btn-ghost" data-action="open-config">⚙️ SharePoint</button>'+
          '<button class="btn btn-primary" data-action="reload" '+(state.loading?'disabled':'')+'>'+(state.loading?'Loading…':'↻ Reload')+'</button>'+
        '</div>'+
      '</div>';
    }
    function renderToolbar(depts,count){
      var optsDept='<option value="">All Departments</option>'+depts.map(function(d){return '<option value="'+escapeHtml(d)+'" '+(state.filterDept===d?'selected':'')+'>'+escapeHtml(d)+'</option>';}).join('');
      var optsTier='<option value="">All Mobility Tiers</option>'+MOBILITY_TIERS.map(function(t){return '<option value="'+t.value+'" '+(state.filterTier===t.value?'selected':'')+'>'+escapeHtml(t.label)+'</option>';}).join('');
      return '<div class="toolbar">'+
        '<div class="search-wrap"><span class="icon">🔍</span><input id="search-input" placeholder="Search by name, title, or location…" value="'+escapeHtml(state.search)+'" /></div>'+
        '<select data-filter="dept">'+optsDept+'</select>'+
        '<select data-filter="tier">'+optsTier+'</select>'+
        '<div class="badge-count">'+count+' of '+state.employees.length+'</div>'+
      '</div>';
    }
    function renderStats(s){
      return '<div class="stats">'+
        statBox('👥','Total Talent',s.total,'var(--accent)')+
        statBox('🏆','High Potential (Box ≥4 in 2026)',s.high,'var(--success)')+
        statBox('✈️','Fully Mobile (Tier 3)',s.mobile,'var(--accent2)')+
      '</div>';
    }
    function statBox(icon,label,val,color){
      return '<div class="stat"><div class="stat-icon" style="color:'+color+'">'+icon+'</div><div><div class="stat-label">'+label+'</div><div class="stat-val">'+val+'</div></div></div>';
    }
    function renderCard(emp){
      var editing=state.editingId===emp.id;
      var d=editing?state.drafts[emp.id]:emp;
      var saving=!!state.saving[emp.id];
      function ratingChip(yr,key){
        var v=d[key];var color=v&&BOX_LABELS[v]?BOX_LABELS[v].color:'var(--surface3)';
        var inner=editing
          ?'<select class="rating-select" data-edit="'+emp.id+'" data-field="'+key+'" style="color:'+(v?color:'var(--text-muted)')+'"><option value="">–</option>'+[1,2,3,4,5].map(function(n){return '<option value="'+n+'" '+(v==n?'selected':'')+'>'+n+'</option>';}).join('')+'</select>'
          :'<div class="box-val" style="background:'+(v?color:'var(--surface3)')+'">'+(v||'–')+'</div>';
        return '<div class="rating-chip"><div class="year">'+yr+'</div>'+inner+'</div>';
      }
      function track(key,label,cls){
        var v=d[key]||'';
        var body=editing
          ?'<textarea class="succession-textarea" data-edit="'+emp.id+'" data-field="'+key+'" placeholder="Names…">'+escapeHtml(v)+'</textarea>'
          :'<div class="succession-names">'+(v?escapeHtml(v):'<span style="color:var(--text-muted)">—</span>')+'</div>';
        return '<div class="succession-col"><div class="col-label '+cls+'">'+label+'</div>'+body+'</div>';
      }
      var mobilityBlock=editing
        ?'<select class="mobility-select" data-edit="'+emp.id+'" data-field="mobilityTier"><option value="">—</option>'+MOBILITY_TIERS.map(function(t){return '<option value="'+t.value+'" '+(d.mobilityTier==t.value?'selected':'')+'>'+escapeHtml(t.label)+'</option>';}).join('')+'</select>'
        :'<div class="meta-pill"><strong>'+(d.mobilityTier?'Tier '+d.mobilityTier:'—')+'</strong></div>';
      var notesBlock=editing
        ?'<textarea class="notes-textarea" data-edit="'+emp.id+'" data-field="relocationNotes" placeholder="Add relocation notes…">'+escapeHtml(d.relocationNotes||'')+'</textarea>'
        :'<div style="font-size:12px;line-height:1.5;color:'+(d.relocationNotes?'var(--text)':'var(--text-muted)')+'">'+(d.relocationNotes?escapeHtml(d.relocationNotes):'No relocation notes')+'</div>';
      var actions=editing
        ?'<button class="btn btn-ghost btn-sm" data-action="cancel-edit" data-id="'+emp.id+'" '+(saving?'disabled':'')+'>Cancel</button><button class="btn btn-success btn-sm" data-action="save-edit" data-id="'+emp.id+'" '+(saving?'disabled':'')+'>'+(saving?'Saving…':'✓ Save')+'</button>'
        :'<button class="btn btn-ghost btn-sm" data-action="start-edit" data-id="'+emp.id+'">✏️ Edit</button>';
      return '<div class="card '+(editing?'editing':'')+'">'+
        '<div class="card-header">'+
          '<div class="avatar">'+initials(emp.name)+'</div>'+
          '<div style="flex:1;min-width:0"><div class="card-name">'+escapeHtml(displayName(emp.name))+'</div><div class="card-title">'+escapeHtml(emp.title||'')+'</div><div class="card-meta">'+escapeHtml(emp.department||'')+(emp.department&&emp.location?' · ':'')+escapeHtml(emp.location||'')+'</div></div>'+
          '<div class="card-actions">'+actions+'</div>'+
        '</div>'+
        '<div class="card-body">'+
          '<div><div class="section-label">Box Ratings</div><div class="ratings-row">'+ratingChip('2024','box2024')+ratingChip('2025','box2025')+ratingChip('2026','box2026')+'</div></div>'+
          '<div><div class="section-label">Succession Track</div><div class="succession-grid">'+track('readyNow','Ready Now','now')+track('ready12','1–2 Years','y12')+track('ready35','3–5 Years','y35')+'</div></div>'+
          '<div class="meta-row"><div class="meta-pill">Leader: <strong>'+escapeHtml(emp.leader||'—')+'</strong></div>'+(emp.timeInJob?'<div class="meta-pill">In role: <strong>'+escapeHtml(emp.timeInJob)+'</strong></div>':'')+'<div style="display:flex;align-items:center;gap:4px"><span style="font-size:11px;color:var(--text-muted)">Mobility:</span>'+mobilityBlock+'</div></div>'+
          '<div><div class="section-label">Relocation Notes</div>'+notesBlock+'</div>'+
        '</div>'+
      '</div>';
    }
    function renderStatus(){var s=state.status;var ico=s.type==='success'?'✅':s.type==='error'?'❌':'ℹ️';return '<div class="status-bar '+s.type+'">'+ico+' '+escapeHtml(s.msg)+'</div>';}
    function renderConfigModal(){
      var c=state.configDraft||state.config;
      var det=detectedSiteUrl();
      var fieldRows=Object.keys(FIELD_MAP).map(function(k){return '<div><span class="k">'+k+'</span><span>'+FIELD_MAP[k]+'</span></div>';}).join('');
      return '<div class="modal-overlay"><div class="modal">'+
        '<h2>⚙️ SharePoint Connection</h2>'+
        '<p>Configure the site URL and list name. Reads and writes go directly to the list when this page is hosted inside SharePoint.</p>'+
        (det&&det!==c.siteUrl?'<div style="font-size:11px;color:var(--accent);margin-bottom:10px;cursor:pointer" data-action="use-detected">Use detected: '+escapeHtml(det)+'</div>':'')+
        '<div class="form-group"><label>Site URL</label><input id="cfg-site" placeholder="https://tenant.sharepoint.com/teams/your-team" value="'+escapeHtml(c.siteUrl)+'" /></div>'+
        '<div class="form-group"><label>List Name (exact)</label><input id="cfg-list" placeholder="SAMPLE TR Succession" value="'+escapeHtml(c.listName)+'" /></div>'+
        '<div class="field-map"><div class="field-map-title">SharePoint Internal Field Names</div><div class="field-map-grid">'+fieldRows+'</div></div>'+
        '<div class="modal-footer"><button class="btn btn-ghost" data-action="close-config">Cancel</button><button class="btn btn-primary" data-action="save-config">Save & Connect</button></div>'+
      '</div></div>';
    }

    // ---- Filtering / Stats ----
    function getFiltered(){var q=state.search.toLowerCase();return state.employees.filter(function(e){var mq=!q||(e.name||'').toLowerCase().indexOf(q)>=0||(e.title||'').toLowerCase().indexOf(q)>=0||(e.location||'').toLowerCase().indexOf(q)>=0;var md=!state.filterDept||e.department===state.filterDept;var mt=!state.filterTier||e.mobilityTier===state.filterTier;return mq&&md&&mt;});}
    function getDepts(){var seen={};state.employees.forEach(function(e){if(e.department)seen[e.department]=1;});return Object.keys(seen).sort();}
    function getStats(){var high=0,mobile=0;state.employees.forEach(function(e){if((e.box2026||0)>=4)high++;if(e.mobilityTier==='3')mobile++;});return{total:state.employees.length,high:high,mobile:mobile};}

    // ---- Events ----
    function attachEvents(){
      document.querySelectorAll('[data-action]').forEach(function(el){
        el.addEventListener('click',function(){
          var a=el.dataset.action;var id=el.dataset.id?parseInt(el.dataset.id,10):null;
          if(a==='reload')return load();
          if(a==='open-config'){state.configOpen=true;state.configDraft=Object.assign({},state.config);return render();}
          if(a==='close-config'){state.configOpen=false;state.configDraft=null;return render();}
          if(a==='save-config'){
            var site=document.getElementById('cfg-site').value.trim();
            var list=document.getElementById('cfg-list').value.trim();
            state.config={siteUrl:site,listName:list};saveConfig(state.config);
            state.configOpen=false;state.configDraft=null;render();load();return;
          }
          if(a==='use-detected'){var d=detectedSiteUrl();if(d){state.configDraft=Object.assign({},state.configDraft||state.config,{siteUrl:d});render();}return;}
          if(a==='start-edit'){state.editingId=id;var emp=state.employees.find(function(e){return e.id===id;});state.drafts[id]=Object.assign({},emp);return render();}
          if(a==='cancel-edit'){state.editingId=null;delete state.drafts[id];return render();}
          if(a==='save-edit')return saveEdit(id);
        });
      });
      var si=document.getElementById('search-input');
      if(si){si.addEventListener('input',function(e){state.search=e.target.value;var f=getFiltered();var bc=document.querySelector('.badge-count');if(bc)bc.textContent=f.length+' of '+state.employees.length;rerenderGrid(f);});}
      document.querySelectorAll('select[data-filter]').forEach(function(s){s.addEventListener('change',function(e){if(s.dataset.filter==='dept')state.filterDept=e.target.value;else state.filterTier=e.target.value;render();});});
      document.querySelectorAll('[data-edit]').forEach(function(el){
        var id=parseInt(el.dataset.edit,10);var field=el.dataset.field;
        el.addEventListener('change',function(e){var v=e.target.value;if(/^box/.test(field))v=v?parseInt(v,10):null;state.drafts[id]=state.drafts[id]||{};state.drafts[id][field]=v;});
        el.addEventListener('input',function(e){state.drafts[id]=state.drafts[id]||{};state.drafts[id][field]=e.target.value;});
      });
    }
    function rerenderGrid(filtered){
      var grid=document.querySelector('.grid')||document.querySelector('.empty');if(!grid)return;
      var html=filtered.length===0?'<div class="empty"><h3>No matching employees</h3><p>Try clearing filters.</p></div>':'<div class="grid">'+filtered.map(renderCard).join('')+'</div>';
      var wrap=document.createElement('div');wrap.innerHTML=html;grid.replaceWith(wrap.firstElementChild);attachEvents();
    }

    function saveEdit(id){
      var draft=state.drafts[id];if(!draft){state.editingId=null;return render();}
      state.saving[id]=true;render();
      var emp=state.employees.find(function(e){return e.id===id;});
      var prev=Object.assign({},emp);
      Object.assign(emp,draft);
      if(state.source==='sharepoint'){
        updateItem(state.config,id,draft).then(function(){
          state.saving[id]=false;state.editingId=null;delete state.drafts[id];showStatus('success','Saved to SharePoint');
        }).catch(function(err){
          Object.assign(emp,prev);state.saving[id]=false;showStatus('error','Save failed: '+err.message);render();
        });
      } else {
        setTimeout(function(){state.saving[id]=false;state.editingId=null;delete state.drafts[id];showStatus('info','Saved locally (sample data — not synced to SharePoint)');},250);
      }
    }

    function load(){
      state.loading=true;state.lastError=null;render();
      fetchItems(state.config).then(function(items){
        state.employees=items;state.source='sharepoint';state.loading=false;
        showStatus('success','Loaded '+items.length+' records from SharePoint');
      }).catch(function(err){
        state.lastError=err.message;state.employees=SAMPLE;state.source='sample';state.loading=false;
        showStatus('error','SharePoint unavailable — showing sample data');
      });
    }

    load();
  })();
  </script>
</body>
</html>
